    <!-- Inline and before the stylesheet on purpose: this is the one thing on
         the page that has to run before the first paint. Deferred, a dark-mode
         visitor gets a white flash on every load. It picks the opening state
         and nothing else; the switch itself lives in lang.js. -->
    <script>
      try {
        var saved = localStorage.getItem("cv-theme");
        document.documentElement.dataset.theme =
          saved === "dark" || saved === "light"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (e) {
        // Private mode can throw on localStorage. The page still has a theme.
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <script src="lang.js?v=56" defer></script>
    <script src="numbers.js?v=56" defer></script>
